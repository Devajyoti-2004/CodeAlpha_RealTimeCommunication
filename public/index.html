<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RealMeet — Real-time collaboration</title><link rel="stylesheet" href="/styles.css"></head><body><main class="auth-shell"><section class="brand"><div class="logo">RM</div><span>RealMeet</span></section><div class="auth-card"><div class="eyebrow">REAL-TIME COLLABORATION</div><h1>Meet, share, build.</h1><p class="muted">Secure video rooms with screen sharing, chat, files and a collaborative whiteboard.</p><div class="tabs"><button class="tab active" data-mode="login">Sign in</button><button class="tab" data-mode="register">Create account</button></div><form id="authForm"><label>Username<input id="username" autocomplete="username" required minlength="3" maxlength="32" placeholder="e.g. devajyoti"></label><label>Password<input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="Minimum 8 characters"></label><button class="primary" type="submit" id="submitBtn">Enter RealMeet <span>→</span></button></form><div id="authMsg" class="msg"></div></div><div class="auth-foot">WebRTC · Socket.IO · Encrypted transport</div></main><script src="/auth.js"></script></body></html>
