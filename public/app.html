<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RealMeet Room</title><link rel="stylesheet" href="/styles.css"><script src="/socket.io/socket.io.js"></script></head><body class="app-body"><header class="topbar"><div class="brand small"><div class="logo">RM</div><span>RealMeet</span></div><div class="room-meta"><span id="roomName">Room</span><button id="copyRoom" class="ghost">Copy invite</button></div><div class="user-area"><span id="me"></span><button id="logout" class="ghost">Sign out</button></div></header><main class="workspace"><section class="stage"><div id="videos" class="video-grid"></div><div id="status" class="status-pill">Connecting…</div><div class="controls"><button id="mic" class="control on">🎙 <span>Mute</span></button><button id="cam" class="control on">▣ <span>Camera</span></button><button id="screen" class="control">▤ <span>Share screen</span></button><button id="board" class="control">✎ <span>Whiteboard</span></button><button id="file" class="control">↥ <span>Send file</span></button><button id="leave" class="control danger">☎ <span>Leave</span></button></div></section><aside class="side"><div class="side-tabs"><button class="side-tab active" data-panel="chatPanel">Chat</button><button class="side-tab" data-panel="peoplePanel">People <b id="peopleCount">1</b></button></div><div id="chatPanel" class="panel"><div id="chatLog" class="chat-log"></div><form id="chatForm" class="chat-form"><input id="chatInput" maxlength="1000" placeholder="Message everyone…"><button>Send</button></form></div><div id="peoplePanel" class="panel hidden"><div id="peopleList"></div><div class="tip">Calls are peer-to-peer. For the best experience, keep rooms small.</div></div></aside></main><input type="file" id="fileInput" hidden><div id="boardModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2>Collaborative whiteboard</h2><button id="closeBoard">×</button></div><div class="board-tools"><button id="clearBoard" class="ghost">Clear</button><label>Size <input id="brushSize" type="range" min="1" max="18" value="4"></label></div><canvas id="boardCanvas" width="1200" height="650"></canvas></div></div><div id="toast" class="toast"></div><script src="/app.js"></script></body></html>
